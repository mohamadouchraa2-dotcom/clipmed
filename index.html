    const st = SCRIPT_TOOLS[id];

    const r = await fetch(AI_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) });
    let data = {};
    try { data = await r.json(); } catch (e) {}
    if (!r.ok || !data.reply) throw new Error(`${r.status} ${data.error || 'No details'}`);
    const clean = data.reply.replace(/\*\*/g, '');
    return st.mode === 'text' ? [clean.trim()] : clean.split('\n').map((x) => x.replace(/^\s*(?:[-*•]|\d+[.)])\s*/, '').trim()).filter(Boolean);
}
