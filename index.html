};
const SLIDERS = [['b', 'Brightness', 50, 150], ['c', 'Contrast', 50, 160], ['s', 'Saturation', 0, 200], ['h', 'Hue', -180, 180], ['sep', 'Sepia', 0, 100], ['blur', 'Blur', 0, 8]];

function ColorGrader() {
  const [file, setFile] = useState(null);
  const [v, setV] = useState(BASE);
  const ref = useRef(null);
  const filter = `brightness(${v.b}%) contrast(${v.c}%) saturate(${v.s}%) hue-rotate(${v.h}deg) sepia(${v.sep}%) blur(${v.blur}px)`;
  const onFile = (e) => {
    const f = e.target.files[0];
    if (f) setFile({ url: URL.createObjectURL(f), video: f.type.startsWith('video') });
  };
  const capture = () => {
    const el = ref.current; if (!el) return;
    const w = el.videoWidth || el.naturalWidth, h = el.videoHeight || el.naturalHeight;
    if (!w) return;
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    if ('filter' in ctx) { ctx.filter = filter; ctx.drawImage(el, 0, 0, w, h); }
    else { // Safari fallback: brightness, contrast, saturation only
      ctx.drawImage(el, 0, 0, w, h);
      const d = ctx.getImageData(0, 0, w, h), p = d.data, B = v.b / 100, C = v.c / 100, S = v.s / 100;
      for (let i = 0; i < p.length; i += 4) {
        let r = (p[i] * B - 128) * C + 128, g = (p[i + 1] * B - 128) * C + 128, b = (p[i + 2] * B - 128) * C + 128;
        const l = 0.299 * r + 0.587 * g + 0.114 * b;
        p[i] = l + (r - l) * S; p[i + 1] = l + (g - l) * S; p[i + 2] = l + (b - l) * S;
      }
      ctx.putImageData(d, 0, 0);
    }
    const a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = 'clipmed-frame.png'; a.click();
  };
  return (
    <div className="grid gap-5 lg:grid-cols-[1fr_320px]">
      <Card className="grid min-h-[260px] place-items-center overflow-hidden">
        {!file ? (
          <label className={`${btn} cursor-pointer`}><Icon n="upload" /> {tr('Choose a video or image')}
            <input type="file" accept="video/*,image/*" onChange={onFile} className="sr-only" /></label>
        ) : file.video
          ? <video ref={ref} src={file.url} controls playsInline style={{ filter }} className="max-h-[60vh] w-full rounded-xl" />
          : <img ref={ref} src={file.url} style={{ filter }} className="max-h-[60vh] rounded-xl" alt="Preview" />}
      </Card>
      <Card className="space-y-4">
        <div className="flex flex-wrap gap-2">
          {Object.keys(LOOKS).map((k) => <button key={k} onClick={() => setV({ ...BASE, ...LOOKS[k] })} className={ghost}>{tr(k)}</button>)}
        </div>
        {SLIDERS.map(([k, label, min, max]) => (
          <label key={k} className="block text-sm text-gray-300">
            <span className="flex justify-between"><span>{tr(label)}</span><span className="text-gray-400">{v[k]}</span></span>
            <input type="range" min={min} max={max} value={v[k]} onChange={(e) => setV({ ...v, [k]: +e.target.value })} />
          </label>
        ))}
        <button onClick={capture} disabled={!file} className={`${btn} w-full`}><Icon n="camera" /> {tr('Save graded frame (PNG)')}</button>
        <p className="text-xs text-gray-400">{tr('Your file stays on your device. Nothing is uploaded.')}</p>
      </Card>
    </div>
  );
}

const RATIOS = [
  { n: '9:16', w: 1080, h: 1920, u: 'TikTok, Reels, Shorts' }, { n: '16:9', w: 1920, h: 1080, u: 'YouTube, landscape' },
  { n: '1:1', w: 1080, h: 1080, u: 'Square feed post' }, { n: '4:5', w: 1080, h: 1350, u: 'Instagram portrait' }, { n: '21:9', w: 2560, h: 1097, u: 'Cinematic widescreen' },
];
function AspectTool() {
  const [r, setR] = useState(RATIOS[0]);
  const [cw, setCw] = useState(1080);
  const tall = r.h >= r.w;
  return (
    <div className="grid gap-5 lg:grid-cols-[1fr_320px]">
      <Card className="grid h-80 place-items-center">
        <div className="relative bg-ink ring-1 ring-white/20" style={{ aspectRatio: `${r.w}/${r.h}`, height: tall ? '100%' : 'auto', width: tall ? 'auto' : '100%', maxWidth: '100%' }}>
          <div className="absolute inset-[5%] border border-dashed border-accent/80" />
          <div className="absolute inset-[10%] border border-dashed border-white/50" />
          {r.n === '9:16' && <div className="absolute inset-x-0 bottom-0 grid h-[18%] place-items-center bg-red-500/20 text-[10px] text-red-200">{tr('App buttons zone')}</div>}
        </div>
      </Card>
      <Card className="space-y-4">
        <div className="flex flex-wrap gap-2">
          {RATIOS.map((x) => <button key={x.n} onClick={() => setR(x)} aria-pressed={r.n === x.n} className={`${ghost} ${r.n === x.n ? '!border-accent !text-accent' : ''}`}>{x.n}</button>)}
        </div>
        <p className="text-sm text-gray-300">{tr(r.u)}<br /><span className="text-lg font-bold text-white">{r.w} × {r.h}</span></p>
        <label className="block text-sm text-gray-300">{tr('Custom width (px)')}
          <input type="number" min="1" value={cw} onChange={(e) => setCw(+e.target.value)} className={`${inp} mt-1`} /></label>
        <p className="text-sm text-gray-300">{tr('Height at')} {r.n}: <b className="text-white">{Math.round((cw * r.h) / r.w) || 0}px</b></p>
        <p className="text-xs text-gray-400">{tr('Yellow line: action safe (90%). White line: title safe (80%).')}</p>
      </Card>
    </div>
  );
}

const toTC = (f, fps) => { const s = Math.floor(f / fps); return [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60, f % fps].map((n) => String(n).padStart(2, '0')).join(':'); };
const fromTC = (t, fps) => { const p = t.split(':').map(Number); return p.length === 4 && !p.some(isNaN) ? ((p[0] * 60 + p[1]) * 60 + p[2]) * fps + p[3] : null; };
function TimecodeTool() {
  const [fps, setFps] = useState(30);
  const [frames, setFrames] = useState(450);
  const [tc, setTc] = useState('00:00:15:00');
  const [dur, setDur] = useState(10);
  const [speed, setSpeed] = useState(200);
  const back = fromTC(tc, fps);
  return (
    <div className="grid gap-5 md:grid-cols-2">
      <Card className="space-y-4">
        <label className="block text-sm text-gray-300">{tr('Frame rate')}
          <select value={fps} onChange={(e) => setFps(+e.target.value)} className={`${inp} mt-1`}>{[24, 25, 30, 50, 60].map((f) => <option key={f} value={f}>{f} fps</option>)}</select></label>
        <label className="block text-sm text-gray-300">{tr('Frames to timecode')}
          <input type="number" min="0" value={frames} onChange={(e) => setFrames(Math.max(0, +e.target.value))} className={`${inp} mt-1`} /></label>
        <p className="text-2xl font-extrabold text-accent">{toTC(frames, fps)}</p>
        <label className="block text-sm text-gray-300">{tr('Timecode to frames (HH:MM:SS:FF)')}
          <input value={tc} onChange={(e) => setTc(e.target.value)} className={`${inp} mt-1`} /></label>
        <p className="text-2xl font-extrabold text-accent">{back === null ? tr('Use HH:MM:SS:FF') : `${back} ${tr('frames')}`}</p>
      </Card>
      <Card className="space-y-4">
        <h3 className="font-bold">{tr('Speed change')}</h3>
        <label className="block text-sm text-gray-300">{tr('Clip length (seconds)')}
          <input type="number" min="0" value={dur} onChange={(e) => setDur(+e.target.value)} className={`${inp} mt-1`} /></label>
        <label className="block text-sm text-gray-300">{tr('Speed')}: {speed}%
          <input type="range" min="10" max="800" value={speed} onChange={(e) => setSpeed(+e.target.value)} /></label>
        <p className="text-sm text-gray-300">{tr('New length')}</p>
        <p className="text-2xl font-extrabold text-accent">{(dur / (speed / 100)).toFixed(2)}s</p>
      </Card>
    </div>
  );
}

function TapBpm() {
  const [taps, setTaps] = useState([]);
  const tap = () => { const now = performance.now(); setTaps((t) => (t.length && now - t[t.length - 1] > 2500 ? [now] : [...t, now]).slice(-9)); };
  const iv = taps.slice(1).map((t, i) => t - taps[i]);
  const bpm = iv.length ? Math.round(60000 / (iv.reduce((a, b) => a + b) / iv.length)) : 0;
  return (
    <div className="grid gap-5 md:grid-cols-2">
      <Card className="grid place-items-center gap-4 py-10">
        <p className="text-6xl font-extrabold text-accent">{bpm || '--'}<span className="ms-2 text-base text-gray-400">BPM</span></p>
        <button onClick={tap} className="grid h-36 w-36 place-items-center rounded-full bg-accent text-lg font-extrabold text-ink active:scale-95">{tr('TAP')}</button>
        <button onClick={() => setTaps([])} className={ghost}>{tr('Reset')}</button>
      </Card>
      <Card className="space-y-3">
        <h3 className="font-bold">{tr('Where to cut')}</h3>
        {bpm ? [['Every beat', 1], ['Every 2 beats', 2], ['Every bar (4 beats)', 4]].map(([l, m]) => (
          <div key={l} className="flex justify-between rounded-xl bg-ink/60 px-4 py-3"><span className="text-gray-300">{tr(l)}</span><b>{((60 / bpm) * m).toFixed(2)}s</b></div>
        )) : <p className="text-sm text-gray-400">{tr('Tap along to the song at least twice. Then cut your clips on these intervals so edits land on the beat.')}</p>}
      </Card>
    </div>
  );
}

/* ---------- AI TOOLS ---------- */
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const slug = (t) => t.toLowerCase().replace(/\s+/g, '');
const LOCAL = {
  en: {
    hooks: (t) => [`Nobody tells you this about ${t}...`, `I tried ${t} for 7 days. Here is what happened.`, `Stop doing ${t} like this.`, `3 seconds is all you need to get ${t} right.`, `${t}: the mistake I made so you don't have to.`],
    titles: (t) => [`${t} — Full Guide`, `How I Edit ${t} Like a Pro`, `${t}: Before vs After`, `The Only ${t} Tutorial You Need`, `${t} in 60 Seconds`],
    hashtags: (t) => [`#${slug(t)}`, '#videoediting', '#editor', '#shorts', '#reels', '#fyp', '#cinematic', '#transitions'],
    shots: (t) => [`1. Hook close-up, 2s: "${t}"`, '2. Wide establishing shot, 3s', '3. Detail or B-roll insert, 2s', '4. Medium shot with on-screen text, 4s', `5. Payoff shot: ${pick(['zoom-in', 'whip transition', 'speed ramp'])}, 3s`, '6. Call to action and end card, 2s'],
  },
  fr: {
    hooks: (t) => [`Personne ne vous dit ça sur ${t}...`, `J'ai testé ${t} pendant 7 jours. Voici ce qui s'est passé.`, `Arrêtez de faire ${t} comme ça.`, `3 secondes suffisent pour réussir ${t}.`, `${t} : l'erreur que j'ai faite pour que vous l'évitiez.`],
    titles: (t) => [`${t} : le guide complet`, `Comment je monte ${t} comme un pro`, `${t} : avant / après`, `Le seul tuto sur ${t} qu'il vous faut`, `${t} en 60 secondes`],
    hashtags: (t) => [`#${slug(t)}`, '#montagevideo', '#monteur', '#shorts', '#reels', '#pourtoi', '#cinematique', '#transitions'],
    shots: (t) => [`1. Accroche en gros plan, 2 s : « ${t} »`, `2. Plan large d'ouverture, 3 s`, '3. Plan de détail ou B-roll, 2 s', `4. Plan moyen avec texte à l'écran, 4 s`, `5. Plan final : ${pick(['zoom avant', 'transition rapide', 'rampe de vitesse'])}, 3 s`, `6. Appel à l'action et écran de fin, 2 s`],
  },
  ar: {
    hooks: (t) => [`لا أحد يخبرك بهذا عن ${t}...`, `جرّبت ${t} لمدة 7 أيام. هذا ما حدث.`, `توقف عن فعل ${t} بهذه الطريقة.`, `3 ثوانٍ تكفي لتنجح في ${t}.`, `${t}: الخطأ الذي ارتكبته حتى لا ترتكبه أنت.`],
    titles: (t) => [`${t} — الدليل الكامل`, `كيف أقوم بمونتاج ${t} باحتراف`, `${t}: قبل وبعد`, `الشرح الوحيد الذي تحتاجه عن ${t}`, `${t} في 60 ثانية`],
    hashtags: (t) => [`#${slug(t)}`, '#مونتاج', '#مونتير', '#شورتس', '#ريلز', '#فيديو', '#سينمائي', '#انتقالات'],
    shots: (t) => [`1. لقطة افتتاحية قريبة، 2 ث: «${t}»`, '2. لقطة واسعة تأسيسية، 3 ث', '3. لقطة تفصيلية أو B-roll، 2 ث', '4. لقطة متوسطة مع نص على الشاشة، 4 ث', `5. لقطة الذروة: ${pick(['تقريب', 'انتقال سريع', 'تغيير سرعة'])}، 3 ث`, '6. دعوة لاتخاذ إجراء وشاشة النهاية، 2 ث'],
  },
};
async function runAI(tool, input) {
  if (AI_ENDPOINT) {
    try {
      const r = await fetch(AI_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tool, input }) });
      if (r.ok) { const d = await r.json(); return Array.isArray(d.result) ? d.result : String(d.result).split('\n').filter(Boolean); }
    } catch (e) { /* fall back below */ }
  }
  await new Promise((r) => setTimeout(r, 350));
  return LOCAL[LANG][tool](input);
}
function AiTool({ id, ph }) {
  const [input, setInput] = useState('');
  const [out, setOut] = useState([]);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [done, setDone] = useState(-1);
  const run = async () => {
    if (!input.trim()) return setErr(tr('Enter a topic first.'));
    setErr(''); setBusy(true);
    try { setOut(await runAI(id, input.trim())); } catch (e) { setErr(tr('Something went wrong. Try again.')); }
    setBusy(false);
  };
  const copy = (t, i) => { try { navigator.clipboard.writeText(t); setDone(i); setTimeout(() => setDone(-1), 1200); } catch (e) {} };
  return (
    <div className="max-w-2xl">
      <div className="flex flex-col gap-3 sm:flex-row">
        <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && run()} placeholder={tr(ph)} className={inp} />
        <button onClick={run} disabled={busy} className={btn}><Icon n="zap" />{busy ? tr('Working...') : tr('Generate')}</button>
      </div>
      {err && <p className="mt-2 text-sm text-red-300">{err}</p>}
      <ul className="mt-5 space-y-2">
        {out.map((l, i) => (
          <li key={i} className="flex items-center justify-between gap-3 rounded-xl border border-white/10 bg-panel px-4 py-3">
            <span>{l}</span>
            <button onClick={() => copy(l, i)} title="Copy" className="text-gray-400 hover:text-white"><Icon n={done === i ? 'check' : 'copy'} /></button>
          </li>
        ))}
      </ul>
    </div>
  );
}

/* ---------- TOOL REGISTRY ---------- */
const TOOLS = [
  { id: 'grade', kind: 'edit', name: 'Color Grader', icon: 'sliders', hue: 270, desc: 'Preview looks on your own clip or image and save a graded frame.', C: ColorGrader },
  { id: 'aspect', kind: 'edit', name: 'Aspect Ratio & Safe Zones', icon: 'maximize', hue: 200, desc: 'Export sizes for every platform, with safe-zone guides.', C: AspectTool },
  { id: 'tc', kind: 'edit', name: 'Timecode & Speed', icon: 'clock', hue: 20, desc: 'Convert frames to timecode and work out new clip lengths.', C: TimecodeTool },
  { id: 'bpm', kind: 'edit', name: 'Tap BPM', icon: 'music', hue: 330, desc: 'Find a song\'s tempo and the beat intervals to cut on.', C: TapBpm },
  { id: 'hooks', kind: 'ai', name: 'Hook Writer', icon: 'zap', hue: 45, desc: 'Opening lines that stop the scroll in the first 3 seconds.', C: () => <AiTool id="hooks" ph="What is your video about?" /> },
  { id: 'titles', kind: 'ai', name: 'Title Generator', icon: 'type', hue: 160, desc: 'Clear, clickable titles for your videos.', C: () => <AiTool id="titles" ph="Video topic" /> },
  { id: 'hashtags', kind: 'ai', name: 'Hashtag Finder', icon: 'hash', hue: 230, desc: 'A ready set of hashtags for Shorts, Reels and TikTok.', C: () => <AiTool id="hashtags" ph="Main keyword" /> },
  { id: 'shots', kind: 'ai', name: 'Shot List Planner', icon: 'list', hue: 300, desc: 'Turn an idea into a shot-by-shot plan before you film.', C: () => <AiTool id="shots" ph="Describe your video idea" /> },
];

/* ---------- APP ---------- */
function App() {
  const [active, setActive] = useState(null);
  const [lang, setLang] = useState(() => { try { return localStorage.getItem('clipmed_lang'); } catch (e) { return null; } });
  LANG = lang || 'en';
  const pickLang = (l) => { setLang(l); try { localStorage.setItem('clipmed_lang', l); } catch (e) {} };
  useEffect(() => { document.documentElement.lang = LANG; document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr'; }, [lang]);
  const [q, setQ] = useState('');
  const [kind, setKind] = useState('all');
  const list = useMemo(() => {
    const s = q.trim().toLowerCase();
    return TOOLS.filter((t) => (kind === 'all' || t.kind === kind) && (!s || (tr(t.name) + ' ' + tr(t.desc)).toLowerCase().includes(s)));
  }, [q, kind, lang]);
  const tool = TOOLS.find((t) => t.id === active);
  const go = (id) => { setActive(id); window.scrollTo({ top: 0 }); };

  return (
    <>
      {!lang && <LangPicker onPick={pickLang} />}
      <header className="sticky top-0 z-30 flex items-center justify-between border-b border-white/10 bg-panel/70 px-5 py-3 backdrop-blur-md">
        <button onClick={() => go(null)} className="flex items-center gap-3">
          <span className="grid h-10 w-10 place-items-center rounded-xl bg-accent text-ink shadow-lg shadow-accent/20"><Icon n="video" s={22} /></span>
          <span className="text-xl font-extrabold tracking-tight">ClipMed</span>
        </button>
        <div className="flex items-center gap-2">
          {tool && <button onClick={() => go(null)} className={ghost}><Icon n="back" s={16} c="rtl:rotate-180" /> {tr('All tools')}</button>}
          <select value={lang || 'en'} onChange={(e) => pickLang(e.target.value)} aria-label="Language" className="rounded-xl border border-white/10 bg-panel px-3 py-2.5 text-sm font-semibold text-white">
            {Object.entries(NAMES).map(([k, n]) => <option key={k} value={k}>{n}</option>)}
          </select>
        </div>
      </header>

      <main className="mx-auto max-w-6xl px-5 pb-16">
        {tool ? (
          <section className="pt-8">
            <div className="mb-6 flex items-start gap-4">
              <span className="grid h-12 w-12 shrink-0 place-items-center rounded-xl bg-accent text-ink"><Icon n={tool.icon} s={24} /></span>
              <div><h1 className="text-3xl font-extrabold tracking-tight">{tr(tool.name)}</h1><p className="mt-1 text-gray-400">{tr(tool.desc)}</p></div>
            </div>
            <tool.C />
          </section>
        ) : (
          <>
            <section className="grid items-center gap-8 pt-10 md:grid-cols-2">
              <div>
                <h1 className="text-4xl font-extrabold leading-tight tracking-tight md:text-5xl">{tr('Edit faster with tools that work right here.')}</h1>
                <p className="mt-4 max-w-lg text-gray-400 md:text-lg">{tr('Grade footage, size your export, cut to the beat, and plan your next video with AI. No downloads, no sign-up.')}</p>
              </div>
              <HeroArt />
            </section>

            <div className="mt-10 space-y-4">
              <label className="relative block">
                <span className="sr-only">{tr('Search tools')}</span>
                <span className="pointer-events-none absolute inset-y-0 start-4 flex items-center text-gray-400"><Icon n="search" /></span>
                <input value={q} onChange={(e) => setQ(e.target.value)} placeholder={tr('Search tools...')} className={`${inp} ps-12`} />
              </label>
              <div className="noscroll flex gap-2.5 overflow-x-auto" role="group" aria-label="Tool type">
                {[['all', 'All tools'], ['edit', 'Editing tools'], ['ai', 'AI tools']].map(([k, l]) => (
                  <button key={k} onClick={() => setKind(k)} aria-pressed={kind === k}
                    className={`whitespace-nowrap rounded-xl px-5 py-2.5 text-sm font-semibold ${kind === k ? 'bg-accent text-ink' : 'border border-white/10 bg-panel text-gray-300 hover:border-white/30'}`}>{tr(l)}</button>
                ))}
              </div>
            </div>

            {list.length === 0 ? (
              <p className="mt-16 text-center text-gray-400">{tr('No tool matches that search. Try another word.')}</p>
            ) : (
              <div className="mt-6 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
                {list.map((t, i) => (
                  <button key={t.id} onClick={() => go(t.id)} className="group overflow-hidden rounded-2xl border border-white/10 bg-panel text-start transition hover:border-accent/50">
                    <div className="relative h-40">
                      <Cover hue={t.hue} kind={t.kind} seed={i + 1} />
                      <span className="absolute start-3 top-3 rounded-lg bg-black/40 px-3 py-1 text-xs font-semibold text-accent backdrop-blur-md">{t.kind === 'ai' ? tr('AI tool') : tr('Editing tool')}</span>
                      <span className="absolute bottom-3 end-3 grid h-10 w-10 place-items-center rounded-xl bg-accent text-ink"><Icon n={t.icon} /></span>
                    </div>
                    <div className="p-5">
                      <h3 className="text-lg font-bold group-hover:text-accent">{tr(t.name)}</h3>
                      <p className="mt-1 text-sm text-gray-400">{tr(t.desc)}</p>
                      <span className="mt-4 block rounded-xl bg-accent/10 py-3 text-center text-sm font-semibold text-accent group-hover:bg-accent group-hover:text-ink">{tr('Open tool')}</span>
                    </div>
                  </button>
                ))}
              </div>
            )}
          </>
        )}
      </main>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
