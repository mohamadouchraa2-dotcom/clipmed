<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d1e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23FDE047'/><stop offset='1' stop-color='%23F59E0B'/></linearGradient></defs><rect width='48' height='48' rx='13' fill='url(%23g)'/><polygon points='19,13 19,33 35,23' fill='%2312142F' stroke='%2312142F' stroke-width='3' stroke-linejoin='round'/><rect x='10' y='39' width='28' height='3' rx='1.5' fill='%2312142F'/></svg>">
<title>ClipMed — Tools for video editors</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { ink: '#12142F', panel: '#1B1E47', accent: '#FACC15' } } } }
</script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Bricolage Grotesque', system-ui, sans-serif; background: #0b0d1e; color: #fff; -webkit-font-smoothing: antialiased; margin: 0; padding: 0; }
  html[lang=ar] body { font-family: 'Cairo', system-ui, sans-serif; }
  :focus-visible { outline: 2px solid #FACC15; outline-offset: 2px; }
  input[type=range] { accent-color: #FACC15; width: 100%; }
  .glass { background: rgba(27,30,71,.5); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.1); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 10px 40px -16px rgba(0,0,0,.6); }
  .glass-lite { background: rgba(27,30,71,.55); border: 1px solid rgba(255,255,255,.1); }
  .neon { box-shadow: 0 0 22px -4px rgba(250,204,21,.6); }
</style>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
</head>
<body class="min-h-screen flex flex-col justify-between">
<div id="root"></div>

<footer class="w-full border-t border-white/10 bg-ink/60 py-6 text-center text-sm text-gray-400 backdrop-blur-md">
  <div class="mx-auto max-w-6xl px-5 flex flex-col sm:flex-row items-center justify-between gap-4">
    <p>© 2026 ClipMed. All rights reserved.</p>
    <a href="https://www.instagram.com/mr.med.ouchraa?xtok=NTYwejZjeXBxZDRs&utm_source=qr" target="_blank" rel="noopener noreferrer" class="text-accent hover:underline font-semibold flex items-center gap-2">
      Instagram: @mr.med.ouchraa
    </a>
  </div>
</footer>

<script>
"use strict";
const { useState, useRef, useEffect } = React;
const NAMES = { en: 'English', fr: 'Français', ar: 'العربية' };
let LANG = 'en';
const tr = (k) => (I18N[LANG] && I18N[LANG][k]) || k;

const I18N = {
    fr: {
        'All tools': `Tous les outils`, 'Choose a file': `Choisir un fichier`,
        'Photo Editor': `Éditeur de photos`, 'Thumbnail Maker': `Créateur de miniatures`, 'Script Writer': `Rédacteur de scripts`,
        'Search tools...': `Rechercher un outil...`, 'Editing tools': `Outils de montage`, 'AI tools': `Outils IA`,
        'Open tool': `Ouvrir l'outil`, 'Powered by Gemini AI': `Propulsé par Gemini AI`, '100% Free': `100 % gratuit`
    },
    ar: {
        'All tools': `كل الأدوات`, 'Choose a file': `اختر ملفا`,
        'Photo Editor': `تعديل الصور الاحترافي`, 'Thumbnail Maker': `صانع الصور المصغّرة`, 'Script Writer': `كاتب السكريبت`,
        'Search tools...': `ابحث عن أداة...`, 'Editing tools': `أدوات المونتاج`, 'AI tools': `أدوات الذكاء الاصطناعي`,
        'Open tool': `افتح الأداة`, 'Powered by Gemini AI': `مدعوم بـ Gemini AI`, '100% Free': `مجاني 100%`
    }
};

const Logo = ({ s = 40 }) => React.createElement("svg", { width: s, height: s, viewBox: "0 0 48 48" },
    React.createElement("rect", { width: "48", height: "48", rx: "13", fill: "#FACC15" }),
    React.createElement("polygon", { points: "19,13 19,33 35,23", fill: "#12142F" })
);

function PhotoEditor() {
    const [file, setFile] = useState(null);
    return React.createElement("div", { className: "glass p-6 rounded-2xl max-w-xl mx-auto text-center space-y-4" },
        React.createElement("h2", { className: "text-xl font-bold" }, tr('Photo Editor')),
        !file ? React.createElement("label", { className: "btn bg-accent text-ink px-4 py-2 rounded-xl cursor-pointer font-bold inline-block" },
            tr('Choose a file'),
            React.createElement("input", { type: "file", accept: "image/*", onChange: (e) => setFile(URL.createObjectURL(e.target.files[0])), className: "hidden" })
        ) : React.createElement("img", { src: file, className: "max-h-96 mx-auto rounded-xl" })
    );
}

function ThumbnailMaker() {
    const [text, setText] = useState('MY THUMBNAIL');
    return React.createElement("div", { className: "glass p-6 rounded-2xl max-w-xl mx-auto space-y-4" },
        React.createElement("h2", { className: "text-xl font-bold" }, tr('Thumbnail Maker')),
        React.createElement("input", { value: text, onChange: (e) => setText(e.target.value), className: "w-full p-3 bg-white/5 rounded-xl border border-white/10 text-white" }),
        React.createElement("div", { className: "h-48 bg-indigo-950 rounded-xl grid place-items-center text-2xl font-black text-accent" }, text)
    );
}

function ScriptWriter() {
    const [topic, setTopic] = useState('');
    const [vidType, setVidType] = useState('short');
    const [duration, setDuration] = useState('5');
    const [result, setResult] = useState('');

    const generate = () => {
        setResult(vidType === 'long' 
            ? `Long Video Script for (${duration} mins) about: ${topic}\n\n1. Introduction & Hook\n2. Detailed Sections\n3. Conclusion & CTA` 
            : `Short Video Script about: ${topic}\n\n- Fast hook in 3s\n- Main value\n- Quick CTA`);
    };

    return React.createElement("div", { className: "glass p-6 rounded-2xl max-w-xl mx-auto space-y-4" },
        React.createElement("h2", { className: "text-xl font-bold" }, tr('Script Writer')),
        React.createElement("input", { value: topic, onChange: (e) => setTopic(e.target.value), placeholder: "Enter topic...", className: "w-full p-3 bg-white/5 rounded-xl border border-white/10 text-white" }),
        React.createElement("select", { value: vidType, onChange: (e) => setVidType(e.target.value), className: "w-full p-3 bg-ink rounded-xl border border-white/10 text-white" },
            React.createElement("option", { value: "short" }, "Short Video (Reels/TikTok)"),
            React.createElement("option", { value: "long" }, "Long Video")
        ),
        vidType === 'long' && React.createElement("input", { type: "number", value: duration, onChange: e => setDuration(e.target.value), placeholder: "Duration in minutes", className: "w-full p-3 bg-white/5 rounded-xl border border-white/10 text-white" }),
        React.createElement("button", { onClick: generate, className: "w-full py-3 bg-accent text-ink font-bold rounded-xl" }, "Generate Script"),
        result && React.createElement("pre", { className: "p-4 bg-black/40 rounded-xl whitespace-pre-wrap text-sm text-gray-300" }, result)
    );
}

const TOOLS = [
    { id: 'grade', kind: 'edit', name: 'Photo Editor', icon: 'sliders', C: PhotoEditor },
    { id: 'thumb', kind: 'edit', name: 'Thumbnail Maker', icon: 'image', C: ThumbnailMaker },
    { id: 'script', kind: 'ai', name: 'Script Writer', icon: 'fileText', C: ScriptWriter }
];

function App() {
    const [active, setActive] = useState(null);
    const [lang, setLang] = useState('en');
    LANG = lang;
    const tool = TOOLS.find(t => t.id === active);

    return React.createElement("div", { className: "flex flex-col min-h-screen" },
        React.createElement("header", { className: "sticky top-0 z-30 flex items-center justify-between border-b border-white/10 bg-ink/40 px-5 py-3 backdrop-blur-md" },
            React.createElement("button", { onClick: () => setActive(null), className: "flex items-center gap-3" },
                React.createElement(Logo, { s: 40 }),
                React.createElement("span", { className: "text-xl font-extrabold tracking-tight" }, "Clip", React.createElement("span", { className: "text-accent" }, "Med"))
            ),
            React.createElement("div", { className: "flex items-center gap-2" },
                active && React.createElement("button", { onClick: () => setActive(null), className: "px-3 py-1.5 glass rounded-xl text-sm" }, tr('All tools')),
                React.createElement("select", { value: lang, onChange: e => setLang(e.target.value), className: "rounded-xl glass px-3 py-1.5 text-sm text-white bg-ink" },
                    Object.entries(NAMES).map(([k, n]) => React.createElement("option", { key: k, value: k }, n))
                )
            )
        ),
        React.createElement("main", { className: "mx-auto max-w-6xl px-5 pb-16 flex-1 w-full pt-8" },
            tool ? React.createElement(tool.C, null)
            : React.createElement("div", { className: "grid gap-6 sm:grid-cols-2 lg:grid-cols-3" },
                TOOLS.map(t => React.createElement("button", { key: t.id, onClick: () => setActive(t.id), className: "glass p-6 rounded-2xl text-start hover:border-accent/50 transition space-y-2" },
                    React.createElement("h3", { className: "text-lg font-bold text-white" }, tr(t.name)),
                    React.createElement("p", { className: "text-sm text-gray-400" }, "Click to open tool")
                ))
            )
        )
    );
}

const rootElement = document.getElementById('root');
if (rootElement) {
    ReactDOM.createRoot(rootElement).render(React.createElement(App, null));
}
</script>
</body>
</html>
