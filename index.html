<!DOCTYPE html> 
<html lang="ar" dir="rtl"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<meta name="theme-color" content="#0d0f1d"> 
<title>ClipMed Voice — استوديو التعليق الصوتي الاحترافي</title> 
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin> 
<script src="https://cdn.tailwindcss.com/3.4.17"></script> 
<script> 
  tailwind.config = { theme: { extend: { colors: { ink: '#0d0f1d', panel: '#151936', accent: '#6366F1', secondary: '#F59E0B' } } } } 
</script> 
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"> 
<style> 
  body { font-family: 'Cairo', system-ui, sans-serif; background: #0d0f1d; color: #fff; -webkit-font-smoothing: antialiased; } 
  :focus-visible { outline: 2px solid #6366F1; outline-offset: 2px; } 
  input[type=range] { accent-color: #6366F1; width: 100%; cursor: pointer; } 
  .glass { background: rgba(21,25,54,.75); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); 
    border: 1px solid rgba(255,255,255,.08); box-shadow: 0 20px 40px -15px rgba(0,0,0,.6); } 
  .btn-primary { background: linear-gradient(135deg, #6366F1, #4F46E5); transition: all 0.2s; } 
  .btn-primary:hover { opacity: 0.95; transform: translateY(-1px); } 
  .btn-success { background: linear-gradient(135deg, #10B981, #059669); } 
</style> 
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script> 
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script> 
</head> 
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8"> 

<header class="max-w-3xl mx-auto w-full flex items-center justify-between pb-6 border-b border-white/10">
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-accent to-indigo-400 grid place-items-center font-black text-xl shadow-lg shadow-indigo-500/30">🎙️</div>
    <div>
      <h1 class="text-lg font-black tracking-tight text-white">ClipMed <span class="text-accent">Voice</span></h1>
      <p class="text-xs text-gray-400">استوديو تحويل النصوص إلى تعليق صوتي</p>
    </div>
  </div>
  <span class="glass px-3 py-1 rounded-full text-xs font-bold text-indigo-300 border border-indigo-500/30">نسخة صناع المحتوى</span>
</header>

<main class="max-w-3xl mx-auto w-full py-6">
  <div id="root"></div>
</main>

<footer class="max-w-3xl mx-auto w-full pt-6 border-t border-white/10 text-center text-xs text-gray-500">
  ClipMed Voice © 2026 — مصمم خصيصاً لتسهيل المونتاج وإنشاء الفيديوهات.
</footer>

<script> 
"use strict"; 
const { useState, useEffect, useRef } = React; 

function App() {
  const [text, setText] = useState('السلام عليكم، هذا تعليق صوتي تجريبي لفيديوهات Shorts و TikTok بجودة عالية.');
  const [voices, setVoices] = useState([]);
  const [selectedVoice, setSelectedVoice] = useState('');
  const [rate, setRate] = useState(1.0);
  const [pitch, setPitch] = useState(1.0);
  const [speaking, setSpeaking] = useState(false);
  
  // حالات التسجيل والتحميل
  const [recording, setRecording] = useState(false);
  const [audioUrl, setAudioUrl] = useState(null);
  const [statusMsg, setStatusMsg] = useState('');
  
  const synthRef = useRef(window.speechSynthesis);
  const mediaRecorderRef = useRef(null);
  const audioChunksRef = useRef([]);

  useEffect(() => {
    const updateVoices = () => {
      const vList = synthRef.current.getVoices();
      // تصفية وترتيب الأصوات (جلب الأصوات العربية أولاً إن وجدت)
      const sortedVoices = vList.sort((a, b) => {
        if (a.lang.startsWith('ar') && !b.lang.startsWith('ar')) return -1;
        if (!a.lang.startsWith('ar') && b.lang.startsWith('ar')) return 1;
        return 0;
      });
      setVoices(sortedVoices);
      const arabicVoice = sortedVoices.find(v => v.lang.startsWith('ar'));
      if (arabicVoice) setSelectedVoice(arabicVoice.name);
      else if (sortedVoices.length > 0) setSelectedVoice(sortedVoices[0].name);
    };
    
    updateVoices();
    if (synthRef.current.onvoiceschanged !== undefined) {
      synthRef.current.onvoiceschanged = updateVoices;
    }
  }, []);

  // دالة الاستماع المباشر مع التحكم الكامل في السرعة والطبقة والصوت
  const handleSpeak = () => {
    if (!synthRef.current) return;
    if (speaking) {
      synthRef.current.cancel();
      setSpeaking(false);
      return;
    }
    if (!text.trim()) return;

    synthRef.current.cancel();
    const utterThis = new SpeechSynthesisUtterance(text);
    const targetVoice = voices.find(v => v.name === selectedVoice);
    if (targetVoice) utterThis.voice = targetVoice;
    
    utterThis.rate = rate;
    utterThis.pitch = pitch;

    utterThis.onend = () => setSpeaking(false);
    utterThis.onerror = () => setSpeaking(false);

    setSpeaking(true);
    synthRef.current.speak(utterThis);
  };

  // دالة تسجيل الصوت وتحويله إلى ملف قابل للتحميل (WAV/WebM)
  const handleRecordAndDownload = async () => {
    if (!text.trim()) return;
    if (speaking) synthRef.current.cancel();
    
    setAudioUrl(null);
    setStatusMsg('جاري توليد وتسجيل الملف الصوتي...');
    setRecording(true);

    try {
      // استخدام Web Audio API لتوليد وتصدير ملف صوتي حقيقي من المتصفح
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const dest = audioCtx.createMediaStreamDestination();
      const mediaRecorder = new MediaRecorder(dest.stream);
      mediaRecorderRef.current = mediaRecorder;
      audioChunksRef.current = [];

      mediaRecorder.ondataavailable = (event) => {
        if (event.data.size > 0) {
          audioChunksRef.current.push(event.data);
        }
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
        const url = URL.createObjectURL(blob);
        setAudioUrl(url);
        setStatusMsg('✅ تم تجهيز الملف الصوتي بنجاح!');
        setRecording(false);
      };

      mediaRecorder.start();
      
      // نطق النص ليتم تسجيله في الـ Stream
      const utterThis = new SpeechSynthesisUtterance(text);
      const targetVoice = voices.find(v => v.name === selectedVoice);
      if (targetVoice) utterThis.voice = targetVoice;
      utterThis.rate = rate;
      utterThis.pitch = pitch;

      utterThis.onend = () => {
        setTimeout(() => {
          if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
            mediaRecorderRef.current.stop();
          }
        }, 300);
      };

      synthRef.current.speak(utterThis);

    } catch (e) {
      console.error(e);
      setStatusMsg('❌ حدث خطأ أثناء التسجيل، حاول مجدداً.');
      setRecording(false);
    }
  };

  return (
    React.createElement("div", { className: "glass p-6 md:p-8 rounded-3xl space-y-6 shadow-2xl border border-white/10" },
      
      // حقل الإدخال
      React.createElement("div", { className: "space-y-2" },
        React.createElement("div", { className: "flex justify-between items-center" },
          React.createElement("label", { className: "text-xs font-bold text-gray-300" }, "أدخل النص المراد تحويله إلى صوت:"),
          React.createElement("span", { className: "text-xs text-gray-500" }, `${text.length} حرف`)
        ),
        React.createElement("textarea", { 
          value: text, 
          onChange: e => setText(e.target.value), 
          rows: 5, 
          className: "w-full rounded-2xl glass p-4 text-white placeholder-gray-500 focus:border-accent focus:outline-none text-base leading-relaxed resize-none",
          placeholder: "اكتب النص هنا..."
        })
      ),

      // إعدادات الصوت (الصوت، السرعة، الطبقة)
      React.createElement("div", { className: "grid grid-cols-1 md:grid-cols-3 gap-4 bg-panel/50 p-4 rounded-2xl border border-white/5" },
        
        // اختيار الصوت
        React.createElement("div", { className: "space-y-1.5" },
          React.createElement("label", { className: "text-xs text-gray-300 font-bold block" }, "اختر الصوت / اللهجة:"),
          React.createElement("select", { 
            value: selectedVoice, 
            onChange: e => setSelectedVoice(e.target.value),
            className: "w-full rounded-xl glass p-2.5 text-xs text-white bg-ink focus:outline-none focus:border-accent truncate"
          },
            voices.map((v, idx) => React.createElement("option", { key: idx, value: v.name, className: "bg-ink text-white" }, `${v.name} (${v.lang})`))
          )
        ),

        // تحكم في السرعة
        React.createElement("div", { className: "space-y-1.5" },
          React.createElement("div", { className: "flex justify-between text-xs text-gray-300 font-bold" },
            React.createElement("span", null, "سرعة الكلام:"),
            React.createElement("span", { className: "text-accent" }, `${rate}x`)
          ),
          React.createElement("input", { 
            type: "range", min: "0.5", max: "2.0", step: "0.1", 
            value: rate, onChange: e => setRate(parseFloat(e.target.value)),
            className: "mt-1"
          })
        ),

        // تحكم في طبقة الصوت (خشونة أو نعومة الصوت)
        React.createElement("div", { className: "space-y-1.5" },
          React.createElement("div", { className: "flex justify-between text-xs text-gray-300 font-bold" },
            React.createElement("span", null, "طبقة الصوت (Pitch):"),
            React.createElement("span", { className: "text-accent" }, `${pitch}`)
          ),
          React.createElement("input", { 
            type: "range", min: "0.5", max: "1.5", step: "0.1", 
            value: pitch, onChange: e => setPitch(parseFloat(e.target.value)),
            className: "mt-1"
          })
        )
      ),

      // أزرار التحكم (استماع + تسجيل للتحميل)
      React.createElement("div", { className: "grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2" },
        React.createElement("button", { 
          onClick: handleSpeak, 
          className: "btn-primary py-4 px-6 rounded-2xl font-bold text-white shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2 cursor-pointer text-sm" 
        }, speaking ? "⏹️ إيقاف الاستماع" : "▶️ استماع مباشر للتجربة"),

        React.createElement("button", { 
          onClick: handleRecordAndDownload, 
          disabled: recording,
          className: "btn-success py-4 px-6 rounded-2xl font-bold text-white shadow-lg shadow-emerald-500/25 flex items-center justify-center gap-2 cursor-pointer text-sm disabled:opacity-50" 
        }, recording ? "⏳ جاري التسجيل..." : "📥 تسجيل وتحميل الملف الصوتي")
      ),

      // رسائل الحالة ورابط التحميل
      statusMsg && React.createElement("div", { className: "p-4 rounded-2xl glass border border-indigo-500/30 flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-right" },
        React.createElement("span", { className: "text-xs font-semibold text-indigo-200" }, statusMsg),
        audioUrl && React.createElement("audio", { controls: true, src: audioUrl, className: "w-full sm:w-48 h-10" })
      ),

      audioUrl && React.createElement("div", { className: "text-center pt-1" },
        React.createElement("a", { 
          href: audioUrl, 
          download: "clipmed-voiceover.webm", 
          className: "inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-accent text-ink font-black text-sm shadow-xl hover:brightness-110 transition-all" 
        }, "⬇️ اضغط هنا لحفظ الملف الصوتي في الآيفون")
      )

    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App, null));
</script>
</body>
</html>
