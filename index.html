<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<meta name="theme-color" content="#090b1a"> 
<title>ClipMed — Hub لصناع المحتوى والقوالب الجاهزة</title> 
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin> 
<script src="https://cdn.tailwindcss.com/3.4.17"></script> 
<script> 
  tailwind.config = { theme: { extend: { colors: { ink: '#0f1229', panel: '#181b3e', accent: '#FACC15' } } } } 
</script> 
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet"> 
<style> 
  body { font-family: 'Bricolage Grotesque', system-ui, sans-serif; background: #090b1a; color: #fff; -webkit-font-smoothing: antialiased; } 
  html[lang=ar] body { font-family: 'Cairo', system-ui, sans-serif; } 
  :focus-visible { outline: 2px solid #FACC15; outline-offset: 2px; } 
  input[type=range] { accent-color: #FACC15; width: 100%; cursor: pointer; } 
  .noscroll::-webkit-scrollbar { display: none; } 
  body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none; 
    background: 
      radial-gradient(950px 540px at 8% -8%, rgba(99,102,241,.28), transparent 60%), 
      radial-gradient(680px 440px at 100% 4%, rgba(250,204,21,.12), transparent 60%), 
      radial-gradient(850px 620px at 50% 112%, rgba(168,85,247,.22), transparent 60%), 
      linear-gradient(180deg, #090b1a 0%, #0c0f2b 55%, #080917 100%); } 
  .glass { background: rgba(24,27,62,.58); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); 
    border: 1px solid rgba(255,255,255,.09); box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 12px 42px -16px rgba(0,0,0,.65); } 
  .glass-lite { background: rgba(24,27,62,.62); border: 1px solid rgba(255,255,255,.09); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 12px 42px -16px rgba(0,0,0,.65); } 
  .glow:hover { border-color: rgba(250,204,21,.48); box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 0 36px -6px rgba(250,204,21,.32); } 
  .neon { box-shadow: 0 0 22px -4px rgba(250,204,21,.58), inset 0 1px 0 rgba(255,255,255,.38); } 
</style> 
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script> 
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script> 
</head> 
<body class="min-h-screen flex flex-col"> 
<div id="root" class="flex-1 flex flex-col"></div> 
<script> 
"use strict"; 
const { useState, useEffect } = React; 
let LANG = 'ar'; 

const I18N = { 
    ar: { 
        'title': 'كل ما يحتاجه صانع المحتوى في مكان واحد', 
        'subtitle': 'قوالب جاهزة، أفكار، سكريبتات، تحويل النص إلى كلام، وكل ما تحتاجه للبدء في الفيديوهات القصيرة والطويلة.', 
        'search': 'ابحث عن قالب أو أداة...', 
        'all': 'الكل', 
        'shorts': 'فيديوهات Shorts', 
        'long': 'فيديوهات طويلة', 
        'tools': 'أدوات ذكية', 
        'use_template': 'استخدم القالب', 
        'copy': 'نسخ', 
        'copied': 'تم النسخ!', 
        'back': 'رجوع للرئيسية', 
        'generate': 'توليد بالذكاء الاصطناعي', 
        'tts_title': 'محول النص إلى كلام (Text-to-Speech)', 
        'tts_desc': 'اكتب أي نص واجعله يُقرأ بصوت صوتي جاهز للاستخدام في المونتاج.', 
        'speak': 'استماع / قراءة النص', 
        'stop': 'إيقاف', 
        'hooks_title': 'معرض الافتتاحيات القوية (Hooks)', 
        'hooks_desc': 'افتتاحيات جاهزة توقف التمرير في أول 3 ثوانٍ لفيديوهاتك.', 
    } 
}; 
const tr = (k) => (I18N[LANG] && I18N[LANG][k]) || k; 

const Logo = ({ s = 40 }) => (
  React.createElement("svg", { width: s, height: s, viewBox: "0 0 48 48" }, 
    React.createElement("rect", { width: "48", height: "48", rx: "13", fill: "#F59E0B" }), 
    React.createElement("polygon", { points: "19,13 19,33 35,23", fill: "#0f1229" }) 
  )
); 

// قائمة القوالب الجاهزة والأدوات
const ITEMS = [
  { id: 'tts', cat: 'tools', title: 'محول النص إلى صوت (TTS)', desc: 'حول أي نص إلى تعليق صوتي فوري لفيديوهاتك.', icon: '🎤' },
  { id: 'hook_pack', cat: 'shorts', title: 'قالب افتتاحية 3 ثوانٍ خارقة', desc: 'هيكل جاهز لزيادة نسبة الاحتفاظ بالمشاهدين في Shorts.', icon: '⚡' },
  { id: 'script_struct', cat: 'long', title: 'هيكل سكريبت يوتيوب احترافي (8 دقائق)', desc: 'الخطوات السرية لتوزيع الأفكار في فيديو طويل.', icon: '📝' },
  { id: 'cta_pack', cat: 'shorts', title: 'عبارات Call to Action للتعليقات', desc: 'جمل ذكية تحفز المشاهدين على التفاعل والاشتراك.', icon: '💬' },
  { id: 'title_formulas', cat: 'long', title: 'قوالب عناوين لا تُقاوم النقر (CTR)', desc: 'عناوين مثبتة تجذب ملايين المشاهدات.', icon: '🔥' }
];

function App() {
  const [cat, setCat] = useState('all');
  const [search, setSearch] = useState('');
  const [activeTool, setActiveTool] = useState(null);

  // حالة محول النص إلى كلام
  const [ttsText, setTtsText] = useState('السلام عليكم، هذا نص تجريبي لفيديوهات Shorts و TikTok.');
  const [speaking, setSpeaking] = useState(false);

  const handleSpeak = () => {
    if (!('speechSynthesis' in window)) return alert('متصفحك لا يدعم النطق الصوتي');
    if (speaking) {
      window.speechSynthesis.cancel();
      setSpeaking(false);
      return;
    }
    const utter = new SpeechSynthesisUtterance(ttsText);
    utter.lang = 'ar-SA';
    utter.onend = () => setSpeaking(false);
    window.speechSynthesis.speak(utter);
    setSpeaking(true);
  };

  const filtered = ITEMS.filter(i => (cat === 'all' || i.cat === cat) && i.title.toLowerCase().includes(search.toLowerCase()));

  return (
    React.createElement("div", { className: "min-h-screen flex flex-col", dir: "rtl" },
      React.createElement("header", { className: "sticky top-0 z-30 flex items-center justify-between border-b border-white/10 bg-ink/80 px-6 py-4 backdrop-blur-md" },
        React.createElement("div", { onClick: () => setActiveTool(null), className: "flex items-center gap-3 cursor-pointer" }, 
          React.createElement(Logo, { s: 36 }), 
          React.createElement("span", { className: "text-xl font-extrabold tracking-tight text-white" }, "Clip", React.createElement("span", { className: "text-accent" }, "Med"))
        ),
        activeTool && React.createElement("button", { onClick: () => setActiveTool(null), className: "glass px-4 py-2 rounded-xl text-sm font-bold text-accent" }, tr('back'))
      ),
      React.createElement("main", { className: "mx-auto w-full max-w-5xl flex-1 px-5 py-8" },
        !activeTool ? (
          React.createElement("div", { className: "space-y-8" },
            React.createElement("div", { className: "text-center space-y-3" }, 
              React.createElement("h1", { className: "text-3xl md:text-5xl font-extrabold" }, tr('title')), 
              React.createElement("p", { className: "text-gray-400 max-w-xl mx-auto" }, tr('subtitle'))
            ),
            React.createElement("div", { className: "flex flex-col sm:flex-row gap-3" },
              React.createElement("input", { value: search, onChange: e => setSearch(e.target.value), placeholder: tr('search'), className: "w-full rounded-2xl glass px-5 py-3.5 focus:border-accent focus:outline-none" }),
              React.createElement("div", { className: "flex gap-2 overflow-x-auto noscroll" },
                [['all', 'all'], ['shorts', 'shorts'], ['long', 'long'], ['tools', 'tools']].map(([k, l]) => 
                  React.createElement("button", { key: k, onClick: () => setCat(k), className: `px-4 py-3 rounded-2xl text-sm font-bold whitespace-nowrap ${cat === k ? 'bg-accent text-ink neon' : 'glass text-gray-300'}` }, tr(l))
                )
              )
            ),
            React.createElement("div", { className: "grid gap-5 sm:grid-cols-2 lg:grid-cols-3" },
              filtered.map(item => 
                React.createElement("div", { key: item.id, onClick: () => setActiveTool(item.id), className: "glass glow p-6 rounded-3xl flex flex-col justify-between cursor-pointer space-y-4" },
                  React.createElement("div", { className: "space-y-2" },
                    React.createElement("span", { className: "text-3xl block" }, item.icon),
                    React.createElement("h3", { className: "text-lg font-bold" }, item.title),
                    React.createElement("p", { className: "text-sm text-gray-400" }, item.desc)
                  ),
                  React.createElement("span", { className: "text-accent text-sm font-bold flex items-center gap-1" }, tr('use_template'), " ←")
                )
              )
            )
          )
        ) : activeTool === 'tts' ? (
          React.createElement("div", { className: "glass p-8 rounded-3xl space-y-6 max-w-xl mx-auto" },
            React.createElement("h2", { className: "text-2xl font-bold" }, tr('tts_title')),
            React.createElement("p", { className: "text-sm text-gray-400" }, tr('tts_desc')),
            React.createElement("textarea", { value: ttsText, onChange: e => setTtsText(e.target.value), rows: 5, className: "w-full rounded-2xl glass p-4 text-white focus:border-accent focus:outline-none" }),
            React.createElement("button", { onClick: handleSpeak, className: "w-full py-4 rounded-2xl bg-accent text-ink font-bold neon" }, speaking ? tr('stop') : tr('speak'))
          )
        ) : (
          React.createElement("div", { className: "glass p-8 rounded-3xl space-y-6 max-w-xl mx-auto text-center" },
            React.createElement("h2", { className: "text-2xl font-bold" }, "محتوى القالب الجاهز"),
            React.createElement("p", { className: "text-gray-300 leading-relaxed" }, "هذا قالب جاهز ومثالي لاستخدامه مباشرة في تصوير فيديوهاتك القادمة لزيادة التفاعل وجذب المشاهدين."),
            React.createElement("button", { onClick: () => alert(tr('copied')), className: "px-6 py-3 rounded-xl bg-accent text-ink font-bold" }, tr('copy'))
          )
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App, null));
</script>
</body>
</html>
