<!DOCTYPE html> 
<html lang="ar" dir="rtl"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<meta name="theme-color" content="#0d0f1d"> 
<title>ClipMed — منصة صناع المحتوى الاحترافية</title> 
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin> 
<script src="https://cdn.tailwindcss.com/3.4.17"></script> 
<script> 
  tailwind.config = { theme: { extend: { colors: { ink: '#0d0f1d', panel: '#151936', accent: '#6366F1', secondary: '#F59E0B' } } } } 
</script> 
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"> 
<style> 
  body { font-family: 'Cairo', system-ui, sans-serif; background: #0d0f1d; color: #fff; -webkit-font-smoothing: antialiased; } 
  :focus-visible { outline: 2px solid #6366F1; outline-offset: 2px; } 
  input[type=range] { accent-color: #6366F1; width: 100%; cursor: pointer; } 
  .noscroll::-webkit-scrollbar { display: none; } 
  body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none; 
    background: 
      radial-gradient(900px 500px at 10% 0%, rgba(99,102,241,.22), transparent 60%), 
      radial-gradient(700px 400px at 90% 100%, rgba(245,158,11,.14), transparent 60%), 
      linear-gradient(180deg, #0d0f1d 0%, #090a14 100%); } 
  .glass { background: rgba(21,25,54,.65); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); 
    border: 1px solid rgba(255,255,255,.08); box-shadow: 0 15px 35px -10px rgba(0,0,0,.5); } 
  .glow { transition: all .25s ease; } 
  .glow:hover { border-color: rgba(99,102,241,.5); box-shadow: 0 0 30px -5px rgba(99,102,241,.35); transform: translateY(-2px); } 
  .btn-primary { background: linear-gradient(135deg, #6366F1, #4F46E5); transition: opacity 0.2s; } 
  .btn-primary:hover { opacity: 0.9; } 
</style> 
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script> 
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script> 
</head> 
<body class="min-h-screen flex flex-col"> 
<div id="root" class="flex-1 flex flex-col"></div> 
<script> 
"use strict"; 
const { useState, useEffect, useRef } = React; 

const Logo = ({ s = 40 }) => (
  React.createElement("svg", { width: s, height: s, viewBox: "0 0 48 48", style: { filter: 'drop-shadow(0 0 12px rgba(99,102,241,.5))' } }, 
    React.createElement("rect", { width: "48", height: "48", rx: "14", fill: "url(#grad)" }), 
    React.createElement("defs", null, 
      React.createElement("linearGradient", { id: "grad", x1: "0", y1: "0", x2: "1", y2: "1" }, 
        React.createElement("stop", { offset: "0%", stopColor: "#6366F1" }), 
        React.createElement("stop", { offset: "100%", stopColor: "#4F46E5" }) 
      )
    ), 
    React.createElement("polygon", { points: "18,14 18,34 34,24", fill: "#ffffff" }) 
  )
); 

// أداة تحويل النص إلى كلام الاحترافية
function TextToSpeechTool() {
  const [text, setText] = useState('السلام عليكم ورحمة الله، مرحبا بكم في فيديو جديد على قناتي، لا تنسوا الاشتراك والاعجاب بالفيديو!');
  const [voices, setVoices] = useState([]);
  const [selectedVoice, setSelectedVoice] = useState('');
  const [rate, setRate] = useState(1);
  const [pitch, setPitch] = useState(1);
  const [speaking, setSpeaking] = useState(false);
  const synthRef = useRef(window.speechSynthesis);

  useEffect(() => {
    const updateVoices = () => {
      const vList = synthRef.current.getVoices();
      // تفضيل الأصوات العربية إذا وجدت
      setVoices(vList);
      const arabicVoice = vList.find(v => v.lang.startsWith('ar'));
      if (arabicVoice) setSelectedVoice(arabicVoice.name);
      else if (vList.length > 0) setSelectedVoice(vList[0].name);
    };
    updateVoices();
    if (synthRef.current.onvoiceschanged !== undefined) {
      synthRef.current.onvoiceschanged = updateVoices;
    }
  }, []);

  const handleSpeak = () => {
    if (!synthRef.current) return;
    if (speaking) {
      synthRef.current.cancel();
      setSpeaking(false);
      return;
    }
    if (!text.trim()) return;

    const utterThis = new SpeechSynthesisUtterance(text);
    const targetVoice = voices.find(v => v.name === selectedVoice);
    if (targetVoice) utterThis.voice = targetVoice;
    utterThis.rate = rate;
    utterThis.pitch = pitch;

    utterThis.onend = () => setSpeaking(false);
    utterThis.onerror = () => setSpeaking(false);

    setSpeaking(true);
    synthRef.current.speak(utterThis);
  };

  const stopSpeak = () => {
    if (synthRef.current) {
      synthRef.current.cancel();
      setSpeaking(false);
    }
  };

  return (
    React.createElement("div", { className: "glass p-6 md:p-8 rounded-3xl space-y-6 max-w-2xl mx-auto shadow-2xl" },
      React.createElement("div", { className: "space-y-2 text-center" },
        React.createElement("h2", { className: "text-2xl font-black text-white" }, "🎙️ محول النص إلى كلام الاحترافي"),
        React.createElement("p", { className: "text-sm text-gray-400" }, "أدخل النص الخاص بفيديوهاتك، تحكم في سرعة الصوت ودرجته، واستمع للتعليق الصوتي بضغطة زر.")
      ),
      React.createElement("div", { className: "space-y-4" },
        React.createElement("textarea", { 
          value: text, 
          onChange: e => setText(e.target.value), 
          rows: 5, 
          className: "w-full rounded-2xl glass p-4 text-white placeholder-gray-500 focus:border-accent focus:outline-none text-base leading-relaxed resize-none",
          placeholder: "اكتب النص هنا..."
        }),
        React.createElement("div", { className: "grid grid-cols-1 sm:grid-cols-2 gap-4" },
          React.createElement("div", { className: "space-y-1" },
            React.createElement("label", { className: "text-xs text-gray-300 font-semibold" }, "اختر الصوت:"),
            React.createElement("select", { 
              value: selectedVoice, 
              onChange: e => setSelectedVoice(e.target.value),
              className: "w-full rounded-xl glass p-3 text-sm text-white bg-panel focus:outline-none focus:border-accent"
            },
              voices.map((v, idx) => React.createElement("option", { key: idx, value: v.name, className: "bg-ink text-white" }, `${v.name} (${v.lang})`))
            )
          ),
          React.createElement("div", { className: "space-y-1" },
            React.createElement("label", { className: "text-xs text-gray-300 font-semibold" }, `سرعة القراءة: ${rate}x`),
            React.createElement("input", { 
              type: "range", min: "0.5", max: "2", step: "0.1", 
              value: rate, onChange: e => setRate(parseFloat(e.target.value)),
              className: "mt-2"
            })
          )
        ),
        React.createElement("div", { className: "flex gap-3 pt-2" },
          React.createElement("button", { 
            onClick: handleSpeak, 
            className: "flex-1 btn-primary py-4 rounded-2xl font-bold text-white shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2 cursor-pointer" 
          }, speaking ? "⏹️ إيقاف مؤقت / إنهاء" : "▶️ استماع للتعليق الصوتي"),
          speaking && React.createElement("button", { 
            onClick: stopSpeak, 
            className: "glass px-5 py-4 rounded-2xl font-bold text-red-400 hover:bg-red-500/10 cursor-pointer" 
          }, "إلغاء")
        )
      )
    )
  );
}

// قائمة الأدوات والقوالب المتاحة للمنصة
const TOOLS = [
  { id: 'tts', name: 'محول النص إلى كلام', desc: 'حول النصوص إلى تعليق صوتي احترافي جاهز للمونتاج.', icon: '🎙️', component: TextToSpeechTool },
  { id: 'hooks', name: 'أفكار افتتاحيات Shorts', desc: 'أجمل الجمل والخطافات التي توقف التمرير في أول 3 ثوانٍ.', icon: '⚡', component: () => React.createElement("div", { className: "glass p-8 rounded-3xl max-w-xl mx-auto text-center space-y-4" }, React.createElement("h3", { className: "text-xl font-bold" }, "قريباً: بنك الافتتاحيات الخارقة"), React.createElement("p", { className: "text-gray-400 text-sm" }, "قوالب جاهزة لزيادة التفاعل على تيك توك و يوتيوب شورتس.")) },
  { id: 'scripts', name: 'هيكل السكريبت الاحترافي', desc: 'الخطوات السرية لترتيب أفكار الفيديوهات الطويلة لضمان استمرار المشاهدة.', icon: '📝', component: () => React.createElement("div", { className: "glass p-8 rounded-3xl max-w-xl mx-auto text-center space-y-4" }, React.createElement("h3", { className: "text-xl font-bold" }, "قريباً: هيكل سكريبت يوتيوب"), React.createElement("p", { className: "text-gray-400 text-sm" }, "نموذج احترافي لتوزيع الأفكار والمقدمات والـ CTA.")) }
];

function App() {
  const [activeTool, setActiveTool] = useState(null);

  const CurrentComponent = activeTool ? TOOLS.find(t => t.id === activeTool)?.component : null;

  return (
    React.createElement("div", { className: "min-h-screen flex flex-col" },
      React.createElement("header", { className: "sticky top-0 z-30 flex items-center justify-between border-b border-white/10 bg-ink/70 px-6 py-4 backdrop-blur-md" },
        React.createElement("div", { onClick: () => setActiveTool(null), className: "flex items-center gap-3 cursor-pointer" }, 
          React.createElement(Logo, { s: 38 }), 
          React.createElement("span", { className: "text-xl font-black tracking-tight text-white" }, "Clip", React.createElement("span", { className: "text-accent" }, "Med"))
        ),
        activeTool && React.createElement("button", { 
          onClick: () => setActiveTool(null), 
          className: "glass px-4 py-2 rounded-xl text-sm font-bold text-gray-300 hover:text-white cursor-pointer" 
        }, "← العودة للرئيسية")
      ),
      React.createElement("main", { className: "mx-auto w-full max-w-5xl flex-1 px-5 py-10" },
        !activeTool ? (
          React.createElement("div", { className: "space-y-10" },
            React.createElement("div", { className: "text-center space-y-4 max-w-2xl mx-auto" },
              React.createElement("span", { className: "glass inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-xs font-bold text-indigo-400 border border-indigo-500/30" }, "✨ المنصة الخاصة بصناع المحتوى"),
              React.createElement("h1", { className: "text-4xl md:text-5xl font-black tracking-tight leading-tight" }, "أدوات وقوالب ذكية لتطوير قناتك"),
              React.createElement("p", { className: "text-gray-400 text-base leading-relaxed" }, "كل ما تحتاجه لإنتاج فيديوهات احترافية Shorts و فيديوهات طويلة، مصمم بعناية فائقة لتسهيل عملك.")
            ),
            React.createElement("div", { className: "grid gap-6 sm:grid-cols-2 lg:grid-cols-3" },
              TOOLS.map(t => 
                React.createElement("div", { 
                  key: t.id, 
                  onClick: () => setActiveTool(t.id),
                  className: "glass glow p-6 rounded-3xl flex flex-col justify-between cursor-pointer space-y-4 border border-white/5" 
                },
                  React.createElement("div", { className: "space-y-3" },
                    React.createElement("span", { className: "text-4xl block" }, t.icon),
                    React.createElement("h3", { className: "text-lg font-bold text-white" }, t.name),
                    React.createElement("p", { className: "text-sm text-gray-400 leading-relaxed" }, t.desc)
                  ),
                  React.createElement("div", { className: "flex items-center gap-1 text-accent text-sm font-bold pt-2" }, 
                    "استخدم الأداة", 
                    React.createElement("span", { className: "rtl:rotate-180 inline-block" }, "←")
                  )
                )
              )
            )
          )
        ) : (
          React.createElement(CurrentComponent, null)
        )
      ),
      React.createElement("footer", { className: "border-t border-white/10 bg-ink/40 py-6 px-6 text-center text-xs text-gray-500" },
        "ClipMed © 2026 — جميع الحقوق محفوظة لصناع المحتوى."
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App, null));
</script>
</body>
</html>
